<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website | Login</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="container">
    <section class="login-card">
      <div class="logo">M</div>

      <h1 id="heading">Welcome Back</h1>
      <p class="subtitle" id="subtitle">
        Login to your account
      </p>

      <div id="message" class="message" role="status"
           aria-live="polite"></div>

      <form id="authForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password (6+ characters)"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button type="submit" id="submitBtn">
          Login
        </button>
      </form>

      <button type="button" id="forgotBtn" class="text-button">
        Forgot password?
      </button>

      <p class="switch-text" id="switchText">
        Don't have an account?
        <button type="button" id="switchBtn">Sign Up</button>
      </p>

      <section id="dashboard" hidden>
        <h2>Login Successful!</h2>
        <p>You are logged in as:</p>
        <p id="userEmail" class="user-email"></p>
        <button type="button" id="logoutBtn" class="logout">
          Logout
        </button>
      </section>

      <p class="footer">Secure Authentication powered by Firebase</p>
    </section>
  </main>
</body>
</html>
