<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>My Website | Login</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>
  <main class="page">
    <section class="auth-card">
      <div class="logo">M</div>

      <h1 id="heading">Welcome Back</h1>
      <p class="subtitle" id="subtitle">
        Sign in to continue to your account
      </p>

      <div id="message" class="message"
           role="status" aria-live="polite" hidden></div>

      <form id="authForm">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="At least 6 characters"
          minlength="6"
          autocomplete="current-password"
          required
        >

        <button id="submitBtn" class="primary" type="submit">
          Login
        </button>
      </form>

      <button id="forgotBtn" class="text-button" type="button">
        Forgot password?
      </button>

      <p class="switch-row" id="switchText">
        Don't have an account?
        <button id="switchBtn" class="text-button" type="button">
          Sign Up
        </button>
      </p>

      <section id="dashboard" hidden>
        <div class="success-icon">✓</div>
        <h2>You're logged in!</h2>
        <p class="muted">Signed in as</p>
        <p id="userEmail" class="user-email"></p>
        <button id="logoutBtn" class="primary" type="button">
          Logout
        </button>
      </section>

      <p class="footer">Secure authentication powered by Firebase</p>
    </section>
  </main>
</body>
</html>
