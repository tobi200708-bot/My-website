
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>My Website | Firebase Login</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./script.js"></script>
</head>
<body>
  <main class="login-box">
    <div class="logo">M</div>
    <h1 id="heading">Welcome Back</h1>
    <p class="subtitle" id="subtitle">Login to your account</p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password (minimum 6 characters)"
        minlength="6"
        autocomplete="current-password"
        required
      >

      <button id="loginBtn" type="submit">Login</button>

      <p class="switch-text" id="switchText">
        Don't have an account?
      </p>

      <button id="registerBtn" type="button" class="secondary">
        Create Account
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="userArea" hidden>
      <div class="success-icon">✓</div>
      <h2>Login Successful!</h2>
      <p>You are signed in as:</p>
      <p id="userEmail" class="user-email"></p>
      <button id="logoutBtn" type="button">Logout</button>
    </section>

    <p class="footer">Secure authentication powered by Firebase</p>
  </main>
</body>
</html>
